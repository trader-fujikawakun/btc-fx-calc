async function speak(text,key='ready'){answer.textContent=dialogAnswer.textContent=text;mode('speaking');try{const r=await fetch(`${VOICE_API}?key=${encodeURIComponent(key)}`);if(!r.ok)throw 0;const audio=new Audio(URL.createObjectURL(await r.blob()));audio.onended=finishSpeaking;audio.onerror=()=>browserSpeak(text);await audio.play()}catch{browserSpeak(text)}}
function reply(text){heard.textContent='「'+text+'」';mode('thinking');answer.textContent=dialogAnswer.textContent='考えています…';setTimeout(()=>{const btc=market.find(x=>x.code==='BTC');let r,key;if(/相場|ビットコイン|BTC/.test(text)){r=`現在のビットコインは24時間で${btc?.change>=0?'プラス':'マイナス'}${Math.abs(btc?.change||0).toFixed(2)}パーセントです。マーケットコアで最新データを監視しています。`;key=btc?.change>=0?'marketUp':'marketDown'}else if(/名前|誰/.test(text)){r='私はジャービス。ふじかわくんを支える、守護AIです。';key='identity'}else{r='了解しました。これはデモモードですが、音声リンクとマーケットコアは正常に動作しています。';key='ready'}speak(r,key)},360)}
function draw(){const bubbles=document.querySelector('#bubbles');bubbles.innerHTML='';market.slice(0,34).forEach((a,i)=>{const b=document.createElement('button');const size=Math.min(104,31+Math.abs(a.change)*3);b.className='bubble '+(a.change<0?'down':'up');b.style.cssText=`--s:${size}px;--x:${3+(i*29+(i%5)*7)%94}%;--y:${3+(i*47+(i%7)*9)%94}%;--d:${3.2+(i%7)*.46}s;--delay:${-(i%13)*.45}s;--dx:${-24+(i*19)%49}px;--dy:${-22+(i*31)%47}px`;b.title=`${a.code} ${a.price?'$'+a.price.toLocaleString():'DEMO'}`;b.innerHTML=`<b>${a.code}</b><em>${a.change>0?'+':''}${a.change.toFixed(1)}%</em>`;bubbles.append(b)});const doubled=[...market,...market];document.querySelector('#ticker').innerHTML=doubled.map(a=>`<span class="${a.change<0?'down':''}">${a.mark||a.code[0]} ${a.code} ${a.change>0?'+':''}${a.change.toFixed(2)}%</span>`).join('');document.querySelector('#assets').textContent=market.length+' LIVE ASSETS'}
async function loadMarket(){try{const r=await fetch('https://data-api.binance.vision/api/v3/ticker/24hr');if(!r.ok)throw 0;const rows=await r.json(),map=new Map(rows.map(x=>[x.symbol,x]));market=fallback.flatMap(([code,mark])=>{const x=map.get(code+'USDT');return x?[{code,mark,change:+x.priceChangePercent,price:+x.lastPrice}]:[]}).sort((a,b)=>Math.abs(b.change)-Math.abs(a.change));document.querySelector('#sync').textContent='SYNC '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});draw()}catch{draw();document.querySelector('#sync').textContent='DEMO DATA'}}
function startRecognition(){if(!recognition)return;try{recognition.start()}catch{}}
voice.onclick=()=>{if(listening){listening=false;voice.classList.remove('active');voice.textContent='音声会話を開始';recognition?.stop();mode('standby');return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){speak('このブラウザでは音声認識を利用できません。文字入力をご利用ください。');return}recognition=new R();recognition.lang='ja-JP';recognition.continuous=false;recognition.onstart=()=>{listening=true;voice.classList.add('active');voice.textContent='音声会話を終了';mode('listening');answer.textContent='はい、聞いています。'};recognition.onresult=e=>reply(e.results[0][0].transcript);recognition.onend=()=>{if(listening&&core.classList.contains('listening'))setTimeout(startRecognition,500)};startRecognition()};
document.querySelector('#chat').onsubmit=e=>{e.preventDefault();const input=document.querySelector('#message');if(input.value.trim())reply(input.value.trim());input.value=''};document.querySelector('#bootButton').onclick=()=>{document.querySelector('#boot').classList.add('hide');speak('おかえりなさい、ふじかわくん。JARVISデモシステムを起動します。音声リンク、マーケットコア、ともに正常です。','boot')};draw();loadMarket();setInterval(loadMarket,60000);
</script>
</body></html>
